[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spavr"
version = "0.1.0"
description = "Action-conditioned C-JEPA reward and risk modeling for robot manipulation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2.2,<3",
]

[project.scripts]
spavr-preprocess = "preprocessing.preprocess:main"
spavr-train = "train.train:main"
spavr-train-videosaur = "train.train_videosaur:main"
spavr-extract-slots = "train.extract_slots:main"

[project.optional-dependencies]
model = [
    "einops>=0.8,<1",
    "lightning>=2.6,<3",
    "loguru>=0.7,<1",
    "pillow>=11.3,<13",
    "scipy>=1.15,<2",
    "timm>=1.0,<2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.50,<6",
]
train = [
    "av>=17,<18",
    "einops>=0.8,<1",
    "lightning>=2.6,<3",
    "loguru>=0.7,<1",
    "pillow>=11.3,<13",
    "pyyaml>=6,<7",
    "scipy>=1.15,<2",
    "timm>=1.0,<2",
    "tensorboard>=2.19,<3",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.50,<6",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["preprocessing*", "spavr*", "third_party*", "train*", "utils*"]

# These repositories are checked into the C-JEPA submodule. uv installs the
# exact local checkouts instead of resolving unrelated releases from PyPI.
[tool.uv.sources]
stable-pretraining = { path = "third_party/cjepa/src/third_party/stable-pretraining", editable = true }
stable-worldmodel = { path = "third_party/cjepa/src/third_party/stable-worldmodel", editable = true }
nerv = { path = "third_party/cjepa/src/third_party/nerv", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
