# Stage 3B: freeze 3A dynamics and train only the full-trace quantile head.
seed: 42

data:
  root: /data7/yuqingchi/Code/SPAVR/processed_spavr_test
  object_slots_root: /data7/yuqingchi/Code/SPAVR/processed_spavr_test/object_slots/videosaur_dinov2_s14_s6
  history_size: 3
  predicted_size: 2
  action_horizon: 5
  reward_gamma: 1.0
  batch_size: 64
  num_workers: 4
  pin_memory: true

model:
  visual_input_mode: object_slots
  num_objects: 6
  slot_dim: 128
  num_masked_slots: 1
  depth: 6
  heads: 16
  dim_head: 64
  mlp_dim: 2048
  dropout: 0.1
  hidden_dim: 256
  taus: [0.1, 0.5, 0.9]

loss:
  quantile_weight: 1.0
  future_object_weight: 0.0
  future_proprio_weight: 0.0
  masked_history_weight: 0.0

optim:
  head_learning_rate: 3.0e-4
  weight_decay: 1.0e-4

training:
  stage: quantile_head
  init_checkpoint: outputs/spavr_multistage/stage3a_dynamics_h3_p2_s6/best.pt
  require_init_checkpoint: true
  device: auto
  amp: true
  gradient_clip_norm: 1.0
  epochs: 10
  warmup_epochs: 0
  early_stopping_patience: 3
  selection_metric: loss_quantile
  output_dir: outputs/spavr_multistage/stage3b_quantile_head_h3_p2_l5_s6

logging:
  backend: tensorboard
  log_every_steps: 20
  visualize_every_epochs: 1
  visualization_examples: 4
